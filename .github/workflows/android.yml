name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Собрать web-папку
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg www/

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Добавить Android-платформу
        run: npx cap add android

      - name: Синхронизировать
        run: npx cap sync android

      - name: Внедрить нативный модуль NexusNative
        run: |
          D=android/app/src/main/java/com/nexus/aicontrol
          mkdir -p "$D" android/app/src/main/res/xml
          cp native/android/NexusNativePlugin.java.txt "$D/NexusNativePlugin.java"
          cp native/android/ScreenPlugin.java.txt "$D/ScreenPlugin.java"
          cp native/android/ScreenCaptureService.java.txt "$D/ScreenCaptureService.java"
          cp native/android/NexusControlPlugin.java.txt "$D/NexusControlPlugin.java"
          cp native/android/NexusAccessibilityService.java.txt "$D/NexusAccessibilityService.java"
          cp native/android/MainActivity.java.txt "$D/MainActivity.java"
          cp native/android/nexus_accessibility.xml.txt android/app/src/main/res/xml/nexus_accessibility.xml
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = [
              'android.permission.FLASHLIGHT',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.RECORD_AUDIO',
          ]
          queries = (
              '    <queries>\n'
              '        <intent><action android:name="android.speech.RecognitionService"/></intent>\n'
              '        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
              '    </queries>\n'
          )
          if '<queries>' not in s:
              s = s.replace('<application', queries + '    <application', 1)
          add = ''.join('    <uses-permission android:name="%s"/>\n' % x for x in perms if x not in s)
          s = s.replace('<application', add + '    <application', 1)
          svc = (
              '    <service android:name=".ScreenCaptureService" '
              'android:foregroundServiceType="mediaProjection" android:exported="false"/>\n'
              '    <service android:name=".NexusAccessibilityService" android:exported="true" '
              'android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">\n'
              '        <intent-filter>\n'
              '            <action android:name="android.accessibilityservice.AccessibilityService"/>\n'
              '        </intent-filter>\n'
              '        <meta-data android:name="android.accessibilityservice" '
              'android:resource="@xml/nexus_accessibility"/>\n'
              '    </service>\n'
          )
          s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w').write(s)
          print(s)
          PY
          echo "--- java ---"
          ls -la "$D"

      - name: Собрать APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
